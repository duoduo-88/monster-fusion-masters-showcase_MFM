name: "Suggest a wiki edit / Wiki 修訂建議"
description: "Report incorrect or outdated wiki content, or suggest additions / 回報百科錯誤、過時內容或提出補充建議"
title: "[Wiki] "
body:
  - type: markdown
    attributes:
      value: |
        Help improve the Monster Fusion Masters Wiki!
        歡迎協助完善 Monster Fusion Masters Wiki！

        Issues are public. Do not include private information, unpublished code, or account credentials.
        此表單建立的 Issue 為公開內容，請勿提交個人敏感資訊、未公開原始碼或帳號憑證。
  - type: dropdown
    id: page
    attributes:
      label: "Wiki page / 百科頁面"
      description: "Select the article / 請選擇需要修改的文章"
      options:
        - "Home / 首頁"
        - "Game rules / 遊戲規則"
        - "Modes and ranked / 模式與競技"
        - "System requirements / 系統需求"
        - "Development history / 開發歷史"
        - "Other / 其他"
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: "Section or URL / 章節或網址"
      description: "Optional article or section link / 可貼上 Wiki 的頁面或章節連結"
      placeholder: "https://duoduo-88.github.io/monster-fusion-masters-showcase_MFM/rules.html#scoring"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: "Problem or missing information / 問題或補充內容"
      description: "Describe what should be improved / 請具體描述哪裡有錯、過時或缺漏"
      placeholder: "The article currently says... / 目前文章寫的是……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Suggested revision / 建議修改方式"
      description: "Optional proposed wording / 若有適合的修正文句，請一併提供"
      placeholder: "I suggest changing it to... / 建議改成……"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: "References / 參考資料"
      description: "Supporting public sources or links / 相關規則、資料來源或公開連結"
    validations:
      required: false
